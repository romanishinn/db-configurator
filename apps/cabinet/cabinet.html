<style>
/* D&B dealer cabinet — separate page, shares the Supabase session with the configurator. Palette matches it. */

select,.inp{font:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);width:100%}

/* login */

<div id="device"></div>
<script>
const CFG={ url:'https://zypujyrvbegilvtvqras.supabase.co', key:'sb_publishable_1jTysmz6_Tz0zveMQN5GaQ_Pb8dHTL9', site:'./' };
const $=(s,r=document)=>r.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eur=n=>Math.round(Number(n)||0).toLocaleString('de-AT')+' €';
const day=t=>t?new Date(t).toLocaleDateString('de-AT'):'';
const dt=t=>t?new Date(t).toLocaleString('de-AT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
const sb=window.supabase.createClient(CFG.url,CFG.key);

const STAGES=[['new','Новый'],['contacted','Связался'],['visit_agreed','Договорились о выезде'],['consultation','Консультация'],['measured','Замер'],['quote_issued','КП выдано'],['negotiation','Переговоры'],['won','Заказ'],['lost','Отказ']];
const SN=Object.fromEntries(STAGES);
const ROLES={client:'клиент',seller:'продавец',dealer:'дилер',superdealer:'супердилер',superadmin:'суперадмин'};
const STAFF=['seller','dealer','superdealer','superadmin'];
const ICON={leads:'<svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
  model:'<svg viewBox="0 0 24 24"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M12 12l9-5M12 12v10M12 12L3 7"/></svg>',
  brand:'<svg viewBox="0 0 24 24"><path d="M4 7l8-4 8 4-8 4-8-4zm0 0v10l8 4 8-4V7"/></svg>',
  quote:'<svg viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7zM14 3v5h5"/><path d="M10 13h6M10 17h6"/></svg>',
  users:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0112 0M16 6a3 3 0 010 6M21 20a6 6 0 00-5-5.9"/></svg>'};

let me=null,leads=[],staff=[],orgs=[],events={},unread=0;
const state={view:'leads',sel:null,stage:null,tab:null};
let lastSel=null;

function humanError(e){const m=String((e&&(e.message||e.error_description))||e||'');
  if(/Invalid login/i.test(m))return'Неверный e-mail или пароль';
  if(/QUOTE_LIMIT/.test(m))return'Можно сохранить не больше 3 расчётов';
  if(/DISCOUNT_LIMIT/.test(m))return'Скидка выше лимита';
  if(/COMMENT_REQUIRED/.test(m))return'Нужен комментарий';
  if(/lost_needs_reason|lost/.test(m)&&/reason/.test(m))return'Для отказа нужна причина';
  if(/FORBIDDEN|permission denied/.test(m))return'Нет прав на это действие';
  return m||'Ошибка';}
function toast(m){let t=$('.f-toast2');if(t)t.remove();t=el('div','f-toast2',esc(m));document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
const seesAll=()=>me&&(me.role==='superadmin'||me.role==='superdealer');
const isStaff=()=>me&&STAFF.includes(me.role);
const name=p=>p?(p.full_name||p.email):'';
const myOrg=()=>orgs.find(o=>o.id===me.org_id);
const nm=p=>p?(p.full_name||p.email||''):'';

/* ---------- auth ---------- */
async function loadMe(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){me=null;return}
  const {data,error}=await sb.from('profiles').select('id,role,full_name,email,org_id,discount_limit').eq('id',session.user.id).single();
  me=error?null:data;
}
function loginGate(msg){
  let d=$('#login');if(!d){d=el('div');d.id='login';document.body.appendChild(d);}
  d.innerHTML=`<form class="card"><div class="bm"><span class="logo">DB</span> D&B Solutions</div>
    <h2>Вход в кабинет</h2>
    <label>E-mail<input type="email" name="email" autocomplete="username" required></label>
    <label>Пароль<input type="password" name="password" autocomplete="current-password" required></label>
    <div class="msg">${esc(msg||'')}</div>
    <button type="submit" class="go">Войти</button>
    <div class="row"><button type="button" data-reset="1">Забыли пароль?</button><a class="btn" href="${CFG.site}" style="border:0;background:none;color:var(--accent);padding:0">← На сайт</a></div>
    <p class="note">Доступ для дилеров и продавцов выдаёт D&B Solutions по запросу на e-mail.</p></form>`;

  sw.appendChild(el('div','sheet',`<div class="hd"><div class="co"><div class="lg">${lg}</div><div><div class="cn">${esc(dealer?brandName():'D&B Solutions')}</div><div class="cd">${cd}</div></div></div>
    <div class="meta"><h3>Angebot</h3><div class="no">Nr. 251025-3 · ${new Date().toLocaleDateString('de-AT')}</div></div></div>
    <div class="pic">3D-визуализация перголы</div>
    <h5>KONFIGURATION</h5><table><tr><td>Größe · Modell</td><td class="a">6,60 × 3,50 m · S400</td></tr><tr><td>Seiten</td><td class="a">ZIP vorne · Decor rechts</td></tr></table>
    <h5>PREIS</h5><table><tr><td>Pergola S400 · 6,60 × 3,50</td><td class="a">16 669 €</td></tr><tr><td>ZIP-Screen · Decor</td><td class="a">4 150 €</td></tr><tr><td>Montage</td><td class="a">1 250 €</td></tr><tr><td>Summe netto</td><td class="a">20 353 €</td></tr><tr class="tot"><td>Gesamt inkl. USt.</td><td class="a">24 424 €</td></tr></table>
    <div class="foot">Richtpreis auf Basis der Katalogpreise 07/2026. Nicht enthalten: Lieferung, Fundamente, Elektroanschluss. Endgültiger Preis nach Aufmaß vor Ort.</div>`));
  w.appendChild(sw);return w;
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const nv=e.target.closest('[data-view]');if(nv){state.view=nv.dataset.view;state.sel=null;render(false);return}
  const tb=e.target.closest('[data-tab]');if(tb){state.tab=tb.dataset.tab;state.sel=null;render();return}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){state._q=e.target.value;const box=$('#device .leads');/* light re-render keeps focus */ }});
document.addEventListener('change',async e=>{
  const a=e.target;
  if(a.dataset&&a.dataset.assign&&a.value){const c=prompt('Комментарий (можно пусто)')||null;const r=await sb.rpc('assign_lead',{p_lead:a.dataset.assign,p_to:a.value,p_comment:c});if(r.error)return toast(humanError(r.error));reopen(a.dataset.assign);}
  if(a.dataset&&a.dataset.transfer&&a.value){const c=prompt('Комментарий для дилера (обязательно)');if(!c||!c.trim()){return toast('Нужен комментарий')}const r=await sb.rpc('transfer_lead',{p_lead:a.dataset.transfer,p_to:a.value,p_comment:c.trim()});if(r.error)return toast(humanError(r.error));reopen(a.dataset.transfer);}
});
// search: re-render on typing (debounced), keep focus
let qT;document.addEventListener('keyup',e=>{if(e.target.id!=='q')return;clearTimeout(qT);qT=setTimeout(()=>{const v=e.target.value;render();const q=$('#q');if(q){q.focus();q.value=v;q.setSelectionRange(v.length,v.length);}},250)});

sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT'){me=null;loginGate();}});
(async()=>{await loadMe();if(isStaff())refresh();else loginGate();})();
// logout via appbar avatar long-press? simpler: expose a logout on the avatar click
document.addEventListener('click',async e=>{if(e.target.closest('.appbar .ava')){if(confirm('Выйти из кабинета?')){await sb.auth.signOut();me=null;loginGate();}}});
</script>
