name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r test
      - run: ./prototype/build.sh
      - name: Assemble site
        run: |
          mkdir -p _site
          V=$(date +%Y%m%d%H%M%S)
          printf '{"v":"%s"}' "$V" > _site/version.json
          { printf '<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache"><style>[hidden]{display:none!important}body{margin:0}</style><script>window.__BUILD_V="%s";(function(){try{if(sessionStorage.getItem("__vck"))return;fetch("version.json?ts="+Date.now(),{cache:"no-store"}).then(function(r){return r.json()}).then(function(j){if(j&&j.v&&j.v!==window.__BUILD_V){sessionStorage.setItem("__vck","1");location.replace(location.pathname+"?v="+j.v)}}).catch(function(){})}catch(e){}})();</script></head><body>' "$V"; cat prototype/dist/terrace-3d.html; printf '</body></html>'; } > _site/index.html
          # configurator.html — same app, plain head (no auto-reload), used by the CRM iframe and for direct embedding
          { printf '<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}</style></head><body>'; cat prototype/dist/terrace-3d.html; printf '</body></html>'; } > _site/configurator.html
          # crm.html — DEMO of the old Pro CRM (invented data, no database); kept for reference, marked with a banner, not linked from the site.
          python3 -c "t=open('prototype/crm.html').read().replace('/*THREE_MIN*/', open('prototype/vendor/three.min.js').read()); b='<div style=\"position:sticky;top:0;z-index:99999;background:#a96a12;color:#fff;font:600 13px system-ui;padding:6px 10px;text-align:center\">Демо: данные вымышленные. Рабочий кабинет: <a href=\"cabinet.html\" style=\"color:#fff\">cabinet.html</a></div>'; i=t.index('<body>')+6; open('_site/crm.html','w').write(t[:i]+b+t[i:])"
          # cabinet.html — the working staff cabinet (reads lead_board / lead_events / quotes from the database; access is enforced by row level security).
          # The configurator "Pro" button and partner activation (backend.js, join.html) route here.
          cp apps/cabinet/cabinet.html _site/cabinet.html
          cp apps/join/index.html _site/join.html
          # landing.html — German B2C landing, reads the published projects; projects.html — superadmin form that adds them
          cp apps/landing/index.html _site/landing.html
          cp apps/projects/index.html _site/projects.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
