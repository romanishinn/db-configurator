name: Functions
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', '.github/workflows/functions.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: zypujyrvbegilvtvqras
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy Edge Functions
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN secret not set yet: nothing to deploy. Add it in Settings → Secrets → Actions, then re-run this workflow."
            exit 0
          fi
          # The public request endpoint is called by anonymous visitors (no JWT); Turnstile is the gate.
          supabase functions deploy submit-request --project-ref "$PROJECT_REF" --no-verify-jwt
          # Turnstile secret for server-side verification. Falls back to Cloudflare's "always passes" TEST
          # secret until the real one is set, so the flow is testable; set the real TURNSTILE_SECRET to enforce.
          supabase secrets set --project-ref "$PROJECT_REF" \
            TURNSTILE_SECRET="${TURNSTILE_SECRET:-1x0000000000000000000000000000000AA}"
          echo "::notice::Deployed submit-request. Turnstile secret: ${TURNSTILE_SECRET:+real secret set}${TURNSTILE_SECRET:-TEST secret (always passes) — set TURNSTILE_SECRET to enforce}"
