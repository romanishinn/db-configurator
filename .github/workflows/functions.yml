name: Functions
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', '.github/workflows/functions.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: zypujyrvbegilvtvqras
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy Edge Functions
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN secret not set yet: nothing to deploy. Add it in Settings → Secrets → Actions, then re-run this workflow."
            exit 0
          fi
          # create-invite requires a signed-in superadmin (JWT verified by the platform, superadmin re-checked in code)
          supabase functions deploy create-invite --project-ref "$PROJECT_REF"
          # accept-invite is public: there is no login yet, the invite token is the gate
          supabase functions deploy accept-invite --project-ref "$PROJECT_REF" --no-verify-jwt
          # The public request endpoint is called by anonymous visitors (no JWT); Turnstile is the gate.
          # It is deployed ONLY with the real secret: a missing secret used to be replaced by Cloudflare's test secret,
          # which lets every bot through. Without the secret the existing deployment stays as it is.
          if [ -n "$TURNSTILE_SECRET" ]; then
            supabase functions deploy submit-request --project-ref "$PROJECT_REF" --no-verify-jwt
            supabase secrets set --project-ref "$PROJECT_REF" TURNSTILE_SECRET="$TURNSTILE_SECRET"
            echo "::notice::Deployed submit-request with the real Turnstile secret."
          else
            echo "::warning::TURNSTILE_SECRET is not set: submit-request was NOT deployed (a test secret would let every bot through). Add the secret in Settings → Secrets → Actions and re-run."
          fi
