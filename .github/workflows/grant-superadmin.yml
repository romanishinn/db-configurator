name: Grant superadmin
# One-off bootstrap: make an existing user the first superadmin (further roles are set from the app afterwards).
# The user must have signed up once first, so their profile row exists.
on:
  workflow_dispatch:
    inputs:
      email:
        description: E-mail of the user to make superadmin
        required: true
permissions:
  contents: read
jobs:
  grant:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get install -y -q postgresql-client >/dev/null
      - name: Set role = superadmin
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          EMAIL: ${{ inputs.email }}
        run: |
          [ -n "$DATABASE_URL" ] || { echo "::error::SUPABASE_DB_URL secret not set"; exit 1; }
          # the e-mail goes in as a psql variable (:'email' is quoted by psql), so no input can change the statement
          n=$(printf '%s\n' "update public.profiles set role = 'superadmin', active = true where email = :'email';" "select count(*) from public.profiles where email = :'email' and role = 'superadmin';" | psql "$DATABASE_URL" -X -q -tA -v email="$EMAIL" | tail -n 1)
          if [ "$n" = 1 ]; then echo "::notice::$EMAIL is now superadmin";
          else echo "::error::No profile for $EMAIL — the user must sign up once first (Supabase → Authentication → Users), then re-run"; exit 1; fi
