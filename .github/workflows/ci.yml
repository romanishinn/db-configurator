name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Red lines (secrets, forbidden names, purchase data)
        run: sh tools/harness/redlines.sh
        env:
          REDLINE_TERMS: ${{ secrets.REDLINE_TERMS }}
          REDLINE_HISTORY: '1'
          REDLINE_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
      - run: pnpm -r typecheck
      - run: pnpm -r test
