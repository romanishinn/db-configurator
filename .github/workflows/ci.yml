name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Red lines (secrets, forbidden names, purchase data)
        run: sh tools/harness/redlines.sh
        env: { REDLINE_TERMS: '${{ secrets.REDLINE_TERMS }}' }
      - run: pnpm -r typecheck
      - run: pnpm -r test
